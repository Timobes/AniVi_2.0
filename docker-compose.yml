version: '3.8'

services:
  backend:
    build: ./server/
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    depends_on:
      - db

  db: 
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: timober
      POSTGRES_DB: anivi
    ports:
      - "5433:5432"